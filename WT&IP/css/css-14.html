<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14. Create a webpage demonstrating CSS Flexbox.</title>
    <style>
body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 30px; margin: 0; min-height: 100vh; }
        
        .glow-1 { position: fixed; top: -10%; left: -10%; width: 400px; height: 400px; background: #800020; border-radius: 50%; filter: blur(150px); opacity: 0.15; z-index: -1; }
        .glow-2 { position: fixed; bottom: -10%; right: -5%; width: 350px; height: 350px; background: #4a0414; border-radius: 50%; filter: blur(150px); opacity: 0.2; z-index: -1; }

        .glass-card { background: rgba(40, 40, 40, 0.4); backdrop-filter: blur(15px); border: 1px solid rgba(128, 0, 32, 0.3); border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        
        .nav { display: flex; gap: 15px; margin-bottom: 25px; }
        .nav a { text-decoration: none; color: #e0e0e0; padding: 10px 20px; background: rgba(128, 0, 32, 0.15); border: 1px solid rgba(128, 0, 32, 0.4); border-radius: 30px; transition: 0.3s; font-weight: bold; }
        .nav a:hover { background: rgba(128, 0, 32, 0.8); color: white; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(128, 0, 32, 0.4); }
        
        h1.title { margin: 0 0 10px 0; background: linear-gradient(45deg, #ffffff, #d4a3b3); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.desc { color: #a0a0a0; margin: 0; }

        .execution-container { display: flex; gap: 20px; flex-wrap: wrap; }
        .code-panel, .output-panel { flex: 1; min-width: 300px; }
        
        textarea#rawCode { width: 100%; height: 350px; background: rgba(10, 10, 10, 0.8); color: #ffb86c; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; padding: 15px; font-family: monospace; font-size: 1rem; resize: vertical; outline: none; box-sizing: border-box; }
        textarea#rawCode:focus { border-color: rgba(128, 0, 32, 0.8); }
        
        button { cursor: pointer; padding: 12px 25px; font-weight: bold; background: linear-gradient(135deg, #4a0414, #800020); border: none; color: white; border-radius: 8px; width: 100%; transition: 0.3s; margin-bottom: 20px; font-size: 1.1rem; }
        button:hover { box-shadow: 0 0 15px rgba(128, 0, 32, 0.6); transform: translateY(-1px); }
        
        iframe#outputArea { width: 100%; height: 350px; background: rgba(10, 10, 10, 0.8); border-radius: 8px; border: 1px solid rgba(128, 0, 32, 0.5); box-sizing: border-box; border-width: 0px; }
    </style>
</head>
<body>
    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="nav glass-card" style="padding: 15px 25px;">
        <a href="../index.html">Home</a>
        <a href="index.html">Back to Programs</a>
    </div>

    <div class="glass-card">
        <h1 class="title">14. Create a webpage demonstrating CSS Flexbox.</h1>
        <p class="desc">Create a webpage demonstrating CSS Flexbox.</p>
    </div>

    <div class="execution-container">
        <div class="code-panel glass-card">
            <h3 style="margin-top:0; color: #d4a3b3;">Source Code</h3>
            <textarea id="rawCode" spellcheck="false">&lt;style&gt;.flex{display:flex;gap:15px;justify-content:space-between;align-items:center;flex-wrap:wrap}.flex div{padding:30px;background:#4a0414;border-radius:10px;flex:1;min-width:120px;text-align:center}&lt;/style&gt;&lt;div class=&quot;flex&quot;&gt;&lt;div&gt;One&lt;/div&gt;&lt;div&gt;Two&lt;/div&gt;&lt;div&gt;Three&lt;/div&gt;&lt;div&gt;Four&lt;/div&gt;&lt;/div&gt;</textarea>
        </div>

        <div class="output-panel glass-card">
            <h3 style="margin-top:0; color: #d4a3b3;">Live Execution</h3>
            <button onclick="runCode()">Run Code ▶</button>
            <iframe id="outputArea"></iframe>
        </div>
    </div>

    <script>
        function runCode() {
            let code = document.getElementById("rawCode").value;
            let iframe = document.getElementById("outputArea");
            let darkThemeCSS = "<style>body { background-color: #111111; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; padding: 15px; margin: 0; }</style>";
            iframe.srcdoc = darkThemeCSS + code;
        }
        window.onload = runCode;
    </script>
</body>
</html>
